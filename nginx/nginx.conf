# The real client address, whether or not a Cloudflare Tunnel sits in
# front of this container. Cloudflare has already verified
# CF-Connecting-IP against the real TCP peer at their own edge -- but
# that header is only trustworthy here because nothing else can reach
# this container's port 80 except the tunnel (see
# docs/PREPROD_DEPLOY.md's "no parallel public path" requirement; if
# that's ever not true, this becomes spoofable). Falls back to
# $remote_addr when the header is absent, which is every request on the
# test LXC (no tunnel there) -- so this one file is correct in both
# places, and the LXC's behavior is byte-for-byte unchanged.
map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;

    # React dev server, including its hot-reload websocket connection.
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Backend API. The trailing slashes on both `location` and `proxy_pass`
    # strip the /api/ prefix, so /api/health on the outside reaches /health
    # inside the backend container.
    # Service-to-service endpoints (currently MinIO's log webhook, see
    # api/internal_logs.py). MinIO reaches the backend directly over the
    # compose network, so nothing legitimate arrives here through nginx --
    # but /api/ would otherwise proxy it through to the outside world. The
    # bearer token is the real control; this makes it unreachable from
    # off-host at all. Must come before the /api/ block to win the match.
    location /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # Always overwritten from the real peer address (see the map
        # above), never taken from the client -- the backend's rate
        # limiter keys on this, so a client-supplied value would let an
        # attacker rotate around the limit (see api/auth.py's client_ip).
        proxy_set_header X-Real-IP $client_real_ip;

        # Assembly photos routinely exceed nginx's 1m default, which
        # rejected them with a bare 413.
        #
        # Deliberately 5m ABOVE core/uploads.py's MAX_UPLOAD_BYTES (20m),
        # not equal to it. Whichever limit is lower rejects first, and the
        # backend's rejection is the useful one -- it returns JSON naming
        # the actual limit, which the UI shows, whereas nginx returns a
        # bare HTML error page the frontend can only render generically.
        # So the app owns the real limit and this is just a backstop for
        # bodies too large to be worth passing upstream at all.
        client_max_body_size 25m;

        # Defence in depth for user-uploaded files served back from this
        # origin (see core/uploads.py): nosniff stops the browser
        # second-guessing our Content-Type, and the sandboxed, script-less
        # CSP means even a file that somehow renders as markup can't
        # execute anything or reach back to this origin.
        #
        # Scoped to /api/ only -- the Vite dev server on / needs
        # inline/eval for hot reload, so a site-wide policy would break the
        # frontend.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }
}
