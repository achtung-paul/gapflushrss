services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only: the database is reachable from other containers by
      # service name (postgres:5432) regardless of this, so publishing it
      # to the LAN only ever exposed password hashes and encrypted service
      # credentials to the network. For a local DB client, tunnel instead:
      #   ssh -L 5432:localhost:5432 root@192.168.4.78
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      # Loopback-only. Mailhog has no authentication and its API serves
      # every password-reset email in full -- published to the LAN, anyone
      # could request a reset for a known address, read the token here, and
      # take over that account. Tunnel to view sent mail:
      #   ssh -L 8025:localhost:8025 root@192.168.4.78
      - "127.0.0.1:8025:8025"
    expose:
      - "1025" # SMTP, used by the backend

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    ports:
      # Loopback-only, same reasoning as postgres above -- the backend
      # reaches MinIO at minio:9000 on the compose network, so nothing in
      # the app needs these published. Tunnel for the web console:
      #   ssh -L 9001:localhost:9001 root@192.168.4.78
      - "127.0.0.1:9000:9000" # S3-compatible API
      - "127.0.0.1:9001:9001" # web console

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      ROOT_ADMIN_FIRST_NAME: ${ROOT_ADMIN_FIRST_NAME}
      ROOT_ADMIN_LAST_NAME: ${ROOT_ADMIN_LAST_NAME}
      ROOT_ADMIN_EMAIL: ${ROOT_ADMIN_EMAIL}
      ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: gapflushrss-images
      SERVICE_CREDENTIAL_KEY: ${SERVICE_CREDENTIAL_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio:
        condition: service_started
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  miniodata:
