services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Write real log files (not just stdout) so the admin log viewer can
    # read them -- see api/logs.py.
    #
    # log_directory is relative to PGDATA on purpose. Postgres runs as a
    # non-root user, and a freshly created Docker named volume is owned by
    # root, so Postgres cannot write to an arbitrary new volume path. Its
    # own data directory is the one place it is guaranteed to own.
    #
    # The %a (day name) filename plus log_truncate_on_rotation gives
    # exactly seven self-recycling files -- 7-day retention with no
    # external cleanup, which is why the sweeper in core/logging_config.py
    # doesn't touch these.
    #
    # Errors and slow queries only. log_statement=all would copy real
    # dimensional data and user details into files the admin UI exposes.
    command: >
      postgres
      -c logging_collector=on
      -c log_destination=csvlog
      -c log_directory=log
      -c log_filename=postgresql-%a.log
      -c log_truncate_on_rotation=on
      -c log_rotation_age=1d
      -c log_min_error_statement=error
      -c log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only: the database is reachable from other containers by
      # service name (postgres:5432) regardless of this, so publishing it
      # to the LAN only ever exposed password hashes and encrypted service
      # credentials to the network. For a local DB client, tunnel instead:
      #   ssh -L 5432:localhost:5432 root@192.168.4.226
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      # Loopback-only. Mailhog has no authentication and its API serves
      # every password-reset email in full -- published to the LAN, anyone
      # could request a reset for a known address, read the token here, and
      # take over that account. Tunnel to view sent mail:
      #   ssh -L 8025:localhost:8025 root@192.168.4.226
      - "127.0.0.1:8025:8025"
    expose:
      - "1025" # SMTP, used by the backend

  minio:
    # Pinned rather than :latest -- the log webhook below depends on this
    # image's behaviour, and an unpinned tag can change it under us.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # MinIO has no file logging of its own, so it POSTs log events to
      # the backend instead (api/internal_logs.py), which writes them
      # alongside the other services' logs for the admin viewer. The
      # alternative -- reading MinIO's stdout -- would mean giving the
      # backend the Docker socket, i.e. root on the host.
      MINIO_LOGGER_WEBHOOK_ENABLE: "on"
      MINIO_LOGGER_WEBHOOK_ENDPOINT: http://backend:8000/internal/minio-logs
      MINIO_LOGGER_WEBHOOK_AUTH_TOKEN: ${MINIO_LOG_WEBHOOK_TOKEN}
      # Persist undelivered events. MinIO starts before the backend and
      # the backend restarts on every deploy, so without this the events
      # from those windows are simply dropped.
      MINIO_LOGGER_WEBHOOK_QUEUE_DIR: /data/.minio-log-queue
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    ports:
      # Loopback-only, same reasoning as postgres above -- the backend
      # reaches MinIO at minio:9000 on the compose network, so nothing in
      # the app needs these published. Tunnel for the web console:
      #   ssh -L 9001:localhost:9001 root@192.168.4.226
      - "127.0.0.1:9000:9000" # S3-compatible API
      - "127.0.0.1:9001:9001" # web console

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      # Defaulted, not hardcoded -- a host whose .env doesn't set these
      # (the test LXC today) gets exactly the values below, unchanged.
      # An internet-facing host sets real ones instead (see
      # docs/PREPROD_DEPLOY.md): EMAIL_PROVIDER=resend with a real
      # RESEND_API_KEY (or a real SMTP relay with SMTP_USE_TLS=true),
      # COOKIE_SECURE=true once served over HTTPS, POSTGRES_SSLMODE=require
      # once the bundled Postgres terminates TLS, MINIO_SECURE=true once
      # the bundled MinIO does.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@stackfitpro.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
      ROOT_ADMIN_FIRST_NAME: ${ROOT_ADMIN_FIRST_NAME}
      ROOT_ADMIN_LAST_NAME: ${ROOT_ADMIN_LAST_NAME}
      ROOT_ADMIN_EMAIL: ${ROOT_ADMIN_EMAIL}
      ROOT_ADMIN_PASSWORD: ${ROOT_ADMIN_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET: gapflushrss-images
      SERVICE_CREDENTIAL_KEY: ${SERVICE_CREDENTIAL_KEY}
      LOG_DIR: /var/log/gapflushrss
      POSTGRES_LOG_DIR: /pgdata/log
      MINIO_LOG_WEBHOOK_TOKEN: ${MINIO_LOG_WEBHOOK_TOKEN}
      BACKUP_DIR: /var/backups/gapflushrss
    volumes:
      # Log files have to outlive the container: the image is rebuilt on
      # every deploy, which would otherwise discard the whole history the
      # admin viewer exists to show.
      - logs:/var/log/gapflushrss
      # Read-only so the backend can read Postgres's CSV logs, which
      # Postgres writes inside its own data directory (see the postgres
      # service above for why they live there). This does expose the
      # database files to this container -- read-only, and it already
      # holds full credentials for that database, so it grants nothing
      # new, but it is the one untidy part of this arrangement.
      - pgdata:/pgdata:ro
      # Per-client backup snapshots (scripts/backup_client.py,
      # scripts/restore_client.py) -- has to outlive the container for
      # the same reason logs does, and holds a full tenant's data per
      # snapshot, so it needs the same access control as the database
      # itself (see CLAUDE.md's production checklist).
      - backups:/var/backups/gapflushrss
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      # No dependency on mailhog: core/email.py connects to SMTP at send
      # time, not at boot, so waiting on it here only ever bought a
      # slightly earlier failure. Not depending on it means a host that
      # never names mailhog in `docker compose up` (see
      # docker-compose.preprod.yml) doesn't get it pulled in as an
      # implicit dependency either. The test LXC is unaffected -- it
      # still starts every defined service, mailhog included, because
      # its `docker compose up` names none explicitly.
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "5173"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  miniodata:
  logs:
  backups:
