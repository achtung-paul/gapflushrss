[alembic]
script_location = alembic_project

# Unlike alembic.ini, there's no single fixed database for this chain --
# it runs against whichever Postgres service you point it at. See
# alembic_project/env.py for how the URL is resolved (either set
# programmatically by core/service_db.py, or passed with -x db_url=...
# on the command line).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
