# Overlay for an internet-facing pre-production host (behind a
# Cloudflare Tunnel) -- see docs/PREPROD_DEPLOY.md for the full deploy
# procedure. Applied on top of docker-compose.yml, never in place of it:
#
#   docker compose -f docker-compose.yml -f docker-compose.preprod.yml \
#     up -d postgres minio backend frontend nginx
#
# mailhog is deliberately not named above, and (per docker-compose.yml's
# backend service) nothing depends on it, so it's never started here.
#
# Everything that can be a plain env var lives in .env.preprod.example
# instead (COOKIE_SECURE, SMTP_*, MINIO_SECURE, POSTGRES_SSLMODE) --
# this file only holds the handful of things that genuinely can't be:
# command overrides and the TLS cert mounts.

services:
  backend:
    # Same command as the image's own Dockerfile CMD, minus --reload --
    # see docs/PREPROD_DEPLOY.md for why: the reload watcher is a dev
    # convenience with no hardening purpose of its own, but running it
    # here would be the last un-flagged item from CLAUDE.md's checklist.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  postgres:
    # Compose replaces this whole command scalar, so every flag from the
    # base file's postgres command is repeated here, not just the new
    # ones -- keep this in sync with docker-compose.yml's postgres
    # service if those logging flags ever change, or the admin log
    # viewer silently loses Postgres logs on this host only.
    command: >
      postgres
      -c logging_collector=on
      -c log_destination=csvlog
      -c log_directory=log
      -c log_filename=postgresql-%a.log
      -c log_truncate_on_rotation=on
      -c log_rotation_age=1d
      -c log_min_error_statement=error
      -c log_min_duration_statement=1000
      -c ssl=on
      -c ssl_cert_file=/certs/server.crt
      -c ssl_key_file=/certs/server.key
    volumes:
      # Appended to the base file's pgdata mount (Compose concatenates
      # list-valued keys across files), not a replacement for it.
      # Generated by docs/PREPROD_DEPLOY.md's cert instructions --
      # never committed, see .gitignore.
      - ./postgres/certs:/certs:ro

  minio:
    volumes:
      # MinIO's documented cert path/filename convention. Same
      # never-committed, host-generated pattern as postgres above.
      - ./minio/certs:/root/.minio/certs:ro
